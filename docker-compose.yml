services:
  postgres:
    image: postgres:16-alpine
    container_name: presales-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: presales
      POSTGRES_PASSWORD: presales
      POSTGRES_DB: presales
    ports:
      - "5432:5432"
    volumes:
      - presales-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U presales"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: presales-redis
    restart: unless-stopped
    ports:
      # Host 6380 -> container 6379 (avoids clashing with a Redis already on 6379)
      - "6380:6379"
    volumes:
      - presales-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  presales-pgdata:
  presales-redisdata:
